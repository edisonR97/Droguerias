services:
  postgres:
    image: postgres:17-alpine
    container_name: farmacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmacore
      POSTGRES_USER: farmacore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - farmacore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmacore -d farmacore']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: farmacore-local-api:${FARMACORE_VERSION:-0.1.0}
    container_name: farmacore-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://farmacore:${POSTGRES_PASSWORD}@postgres:5432/farmacore?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Defina JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-8h}
      LICENSE_ENFORCEMENT: 'true'
      LICENSE_PUBLIC_KEY_BASE64: ${LICENSE_PUBLIC_KEY_BASE64:?Defina LICENSE_PUBLIC_KEY_BASE64}
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:?Defina PROVISIONING_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: 4310
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420}
    ports:
      - '127.0.0.1:4310:4310'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  farmacore_pgdata:
