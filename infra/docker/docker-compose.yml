services:
  postgres:
    image: postgres:17-alpine
    container_name: farmacore-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmacore
      POSTGRES_USER: farmacore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - farmacore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U farmacore -d farmacore']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  farmacore_pgdata:
